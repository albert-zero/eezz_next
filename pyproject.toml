[project]
name 		= "eezz"
version 	= "0.0.1"
authors 	= [
  { name="Albert Zedlitz", email="albert.zedlitz@eezz.biz" }
]
dependencies = [ 
	"beautifulsoup4 >= 4.12.3",
    "pycryptodome   >= 3.21.0",
	"loguru         >= 0.7.2"
]
description = "A HTML Graphical User Interface for Python"
readme      = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/albert-zero/eezz_next"
