[project]
name 		= "eezz"
version 	= "0.0.9"
authors 	= [
  { name="Albert Zedlitz", email="albert.zedlitz@eezz.biz" }
]
keywords        = ["HTML", "UserInterface"]
dependencies    = [
	"beautifulsoup4",
    "pycryptodome",
	"loguru",
    "lark>=1.0"
]

description = "HTML User Interface for Python"
readme      = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build] 
include = ["eezz", "eezz/webroot"]

[project.urls]
Homepage = "https://github.com/albert-zero/eezz_next"


